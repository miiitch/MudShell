name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Build, component tests and UI tests are shared with publish.yml so the release
      # pipeline cannot validate less than CI does.
      - uses: ./.github/actions/build-and-test

      - name: Pack
        run: dotnet pack src/MudShell.csproj --no-build --configuration Release --output ./artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
