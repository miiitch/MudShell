name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore testdesign_blazor.slnx

      - name: Build
        run: dotnet build testdesign_blazor.slnx --no-restore --configuration Release

      - name: Pack
        run: dotnet pack src/MudBlazorExtended/MudBlazorExtended.csproj --no-build --configuration Release --output ./artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.nupkg
