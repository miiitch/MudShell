name: Publish to NuGet.org

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/MudShell.csproj

      - name: Build
        run: dotnet build src/MudShell.csproj --no-restore --configuration Release

      - name: Pack
        run: dotnet pack src/MudShell.csproj --no-build --configuration Release --output ./artifacts -p:Version=${{ github.ref_name }}

      - name: Push to NuGet.org
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
