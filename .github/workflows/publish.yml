name: Publish to NuGet.org

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    # id-token: write lets GitHub issue an OIDC token that NuGet.org exchanges for a short-lived API key
    # (NuGet trusted publishing). No long-lived NUGET_API_KEY secret is needed.
    permissions:
      contents: read
      id-token: write

    steps:
      # Full history so the tag's ancestry can be checked below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A published NuGet version can never be replaced, and the push step uses
      # --skip-duplicate, so a tag placed on the wrong commit would ship silently.
      - name: Verify the tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "Tag ${{ github.ref_name }} points at ${{ github.sha }}, which is not reachable from origin/main."
            echo "Refusing to publish: move the tag onto a commit merged into main and re-push it."
            exit 1
          fi
          echo "Tag ${{ github.ref_name }} is on main."

      # The version must reach the build, not only the pack: packing with --no-build stamps the
      # .nuspec alone and leaves the compiled assembly at the default 1.0.0.0.
      - uses: ./.github/actions/build-and-test
        with:
          version: ${{ github.ref_name }}

      - name: Pack
        run: dotnet pack src/MudShell.csproj --no-build --configuration Release --output ./artifacts -p:Version=${{ github.ref_name }}

      # Regression guard for the defect this pipeline shipped until 0.2.2: the assembly was
      # stamped 1.0.0.0 regardless of the tag, because only pack received the version.
      - name: Verify the built assembly carries the tag version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $expected = ($tag -split '-')[0]
          $dll = Resolve-Path "src/bin/Release/net10.0/MudShell.dll"
          $actual = [Reflection.AssemblyName]::GetAssemblyName($dll).Version
          Write-Host "AssemblyVersion=$actual (tag $tag)"
          if ("$actual" -notlike "$expected*") {
            Write-Error "Assembly version '$actual' does not match tag '$tag'. The version must reach the build step, not only pack."
            exit 1
          }
          Write-Host "Assembly version matches the tag."

      # Exchanges the job's OIDC token for a temporary NuGet API key. Matches the trusted publishing
      # policy on nuget.org (owner miiitch, repo MudShell, workflow publish.yml, environment release).
      # The NuGet profile user name is read from the secret NUGET_USER of the release environment.
      - name: NuGet login (trusted publishing)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
